################################################################################
# GitLab CI for the Admin Audit Trail module.
#
# Two halves:
#   1. The standard Drupal CI validation jobs (composer-lint, cspell, eslint,
#      phpcs, phpstan, phpunit) provided by the drupalci templates.
#   2. A varbase-e2e BDD browser-test job (Playwright + Cucumber-js) that runs
#      the `tests/features/drupal/**` suite against a freshly installed
#      Drupal Standard site with the module + its handler submodules enabled.
#
# The varbase-e2e suite drives the site entirely through the browser. The first
# feature (01-01-01-users-login) logs in as the Webmaster and provisions the
# per-role testing users, so the before_script only has to build the site,
# enable the modules and install Node + Playwright.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# = Validate stage (all blocking) =
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpunit:
  allow_failure: false
  variables:
    _PHPUNIT_EXTRA: ''

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright

    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - varbase-e2e's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = varbase-e2e BDD - Drupal Standard profile =
varbase-e2e-test:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services - we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  before_script:
    - !reference [.fragments, web_db]
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Admin Audit Trail Test" -y
    # Make the tests/modules/ test helper discoverable by drush en.
    - chmod 644 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/settings.php
    - echo '$settings["extension_discovery_scan_tests"] = TRUE;' >> $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/settings.php
    # Modules are enabled by drush: both Group and this module import parts of
    # their config/install imperatively, which the recipe runner's config-import
    # context skips (Group's membership field, the audit report view).
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en -y
        media media_library workflows content_moderation field_ui dblog
        redirect entityqueue paragraphs group language content_translation
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en -y
        admin_audit_trail
        admin_audit_trail_auth
        admin_audit_trail_block_content
        admin_audit_trail_comment
        admin_audit_trail_config
        admin_audit_trail_entityqueue
        admin_audit_trail_file
        admin_audit_trail_group
        admin_audit_trail_media
        admin_audit_trail_menu
        admin_audit_trail_node
        admin_audit_trail_paragraphs
        admin_audit_trail_redirect
        admin_audit_trail_taxonomy
        admin_audit_trail_user
        admin_audit_trail_user_roles
        admin_audit_trail_workflows
        admin_audit_trail_logger
        admin_audit_trail_test
    # Provision the fixtures through the test recipe: the content types with
    # comments (core recipes), the Editorial workflow on articles, the Image
    # media type, the group/paragraph fixtures, and the module with every
    # handler submodule enabled.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/tests/recipes/admin_audit_trail_test -y
    # The Team group type cannot ship as recipe config: Group's post-save
    # handler builds the membership field imperatively and crashes during a
    # config-import (sync) context, so it is the one entity created directly.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval 'if (!\Drupal::entityTypeManager()->getStorage("group_type")->load("team")) { \Drupal::entityTypeManager()->getStorage("group_type")->create(["id" => "team", "label" => "Team", "creator_membership" => TRUE, "creator_wizard" => FALSE, "new_revision" => FALSE])->save(); }'
    # Multilingual environment for the menu link translation scenario (#3343561):
    # a Spanish language and translatable custom menu links. Enabling content
    # translation must be followed by a cache rebuild so the per-language
    # translation routes exist before the browser scenario runs.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval
        'Drupal\language\Entity\ConfigurableLanguage::createFromLangcode("es")->save(); Drupal::service("content_translation.manager")->setEnabled("menu_link_content", "menu_link_content", TRUE);'
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only `tests/features/drupal/**`. Disable varbase-e2e's
    # auto HTML hook (it cannot await PDF generation from `process.on('exit')`)
    # and run `generate-reports` explicitly after cucumber-js so both HTML and
    # PDF land next to the JSON in `tests/reports/`.
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false
