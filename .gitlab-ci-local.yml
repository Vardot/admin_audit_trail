# Pipeline for `gitlab-ci-local` (https://github.com/firecow/gitlab-ci-local).
#
# The real .gitlab-ci.yml `include:`s the drupalci templates and runs the
# varbase-e2e browser job inside the drupalci PHP-Apache image with a MySQL
# service - none of which gitlab-ci-local can reproduce ($_GITLAB_TEMPLATES_REPO
# is not a public path). This file reproduces the same work in a self-contained
# way so the whole thing can be exercised locally before pushing:
#
#   validate : cspell + eslint linters (Node 20)
#   pages    : MkDocs --strict build
#   test     : varbase-e2e BDD suite against a freshly built Drupal 11 site
#              (MariaDB service + `drush runserver`, the module added via a
#              Composer path repository, all handler submodules + fixtures)
#
# Usage:
#   gitlab-ci-local --file .gitlab-ci-local.yml                 # all jobs
#   gitlab-ci-local --file .gitlab-ci-local.yml varbase-e2e-test # just the suite
#   gitlab-ci-local --file .gitlab-ci-local.yml eslint          # one linter

stages:
  - validate
  - pages
  - test

variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: "1"

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,yml,md,js,ts}" --no-progress
  allow_failure: false

eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - node --version
    # Validate the auto-discovered .eslintrc.json loads and the module JS is
    # clean (the Node test tooling is ignored, mirroring drupalci discovery).
    - node ./node_modules/eslint/bin/eslint.js --no-error-on-unmatched-pattern --ext .js .
    - yarn lint:yaml
  allow_failure: false

pages:
  stage: pages
  image: python:3.12-slim
  before_script:
    - pip install --quiet mkdocs-material pymdown-extensions
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  allow_failure: false

# Self-contained varbase-e2e browser job. One container holds PHP (to build and
# serve the site over SQLite via `drush runserver`) and Node (to run the
# Playwright + Cucumber suite). The module under test is pulled into the site
# through a Composer path repository pointing at the checked-out repo, so the
# exact working-tree code is what gets exercised.
varbase-e2e-test:
  stage: test
  image: node:20-bookworm
  # MariaDB service (Drupal 11 needs SQLite >= 3.45, newer than Debian ships,
  # so use a DB server - the same way the real drupalci pipeline does).
  services:
    - name: mariadb:10.11
      alias: database
  variables:
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    MARIADB_DATABASE: "drupal"
    LAUNCH_URL: "http://127.0.0.1:8888"
    BROWSER: "chromium"
    VARBASE_E2E_REPORT_DISABLE: "1"
    SITE: "/app"
    DB_URL: "mysql://root@database:3306/drupal"
    # Let the PHP built-in server (drush runserver) handle the concurrent
    # requests the AJAX upload / paragraphs steps trigger, instead of
    # serialising them (which would deadlock a single-worker server).
    PHP_CLI_SERVER_WORKERS: "8"
  before_script:
    # --- PHP 8.3 (Sury repo - bookworm ships 8.2, Drupal 11 needs >=8.3) ----
    - apt-get update -qq
    - apt-get install -y -qq lsb-release ca-certificates curl unzip git apt-transport-https >/dev/null
    - curl -sSL https://packages.sury.org/php/apt.gpg -o /etc/apt/trusted.gpg.d/sury-php.gpg
    - echo "deb https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/sury-php.list
    - apt-get update -qq
    - apt-get install -y -qq php8.3-cli php8.3-mysql php8.3-gd php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip default-mysql-client >/dev/null
    - php -v | head -n1
    # Wait for the MariaDB service to accept connections.
    - for i in $(seq 1 60); do mysqladmin --host=database --user=root ping >/dev/null 2>&1 && break; sleep 2; done
    - mysqladmin --host=database --user=root ping
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # --- Node test-runner deps (varbase-e2e + cucumber + playwright) --------
    - cd "$CI_PROJECT_DIR"
    - corepack enable && yarn install
    - ./node_modules/.bin/playwright install --with-deps chromium
    # --- Build a Drupal 11 site with the module via a path repository ------
    - composer create-project drupal/recommended-project "$SITE" --no-interaction --no-install
    - cd "$SITE"
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config --no-plugins allow-plugins.composer/installers true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true
    - composer config repositories.aat path "$CI_PROJECT_DIR"
    - composer require "drupal/admin_audit_trail:*" drupal/redirect drupal/entityqueue drupal/paragraphs "drupal/group:^3.3" drush/drush --no-interaction
    # --- Install + enable + provide test fixtures --------------------------
    - vendor/bin/drush site:install standard --db-url="$DB_URL" --account-name=webmaster --account-pass=dD.123123ddd --site-name="Admin Audit Trail Test" -y
    # Make the tests/modules/ test helper discoverable by drush en.
    - chmod 644 web/sites/default/settings.php
    - echo '$settings["extension_discovery_scan_tests"] = TRUE;' >> web/sites/default/settings.php
    - vendor/bin/drush en -y media media_library workflows content_moderation field_ui dblog redirect entityqueue paragraphs group language content_translation
    - vendor/bin/drush en -y admin_audit_trail admin_audit_trail_auth admin_audit_trail_block_content admin_audit_trail_comment admin_audit_trail_config admin_audit_trail_entityqueue admin_audit_trail_file admin_audit_trail_group admin_audit_trail_media admin_audit_trail_menu admin_audit_trail_node admin_audit_trail_paragraphs admin_audit_trail_redirect admin_audit_trail_taxonomy admin_audit_trail_user admin_audit_trail_user_roles admin_audit_trail_workflows admin_audit_trail_logger admin_audit_trail_test
    # Provision the fixtures through the test recipe, mirroring the canonical
    # .gitlab-ci.yml (#3616117 replaced the provision-fixtures.php script with
    # the tests/recipes/admin_audit_trail_test recipe).
    - vendor/bin/drush recipe "$CI_PROJECT_DIR/tests/recipes/admin_audit_trail_test" -y
    # The Team group type cannot ship as recipe config: Group's post-save
    # handler builds the membership field imperatively and crashes during a
    # config-import (sync) context, so it is the one entity created directly.
    - vendor/bin/drush php:eval 'if (!\Drupal::entityTypeManager()->getStorage("group_type")->load("team")) { \Drupal::entityTypeManager()->getStorage("group_type")->create(["id" => "team", "label" => "Team", "creator_membership" => TRUE, "creator_wizard" => FALSE, "new_revision" => FALSE])->save(); }'
    # Multilingual environment for the menu link translation scenario (#3343561):
    # a Spanish language and translatable custom menu links. Mirrors the
    # canonical .gitlab-ci.yml so the local runner exercises the same path.
    - vendor/bin/drush php:eval 'Drupal\language\Entity\ConfigurableLanguage::createFromLangcode("es")->save(); Drupal::service("content_translation.manager")->setEnabled("menu_link_content", "menu_link_content", TRUE);'
    - vendor/bin/drush cr
    # --- Serve the site in the background ----------------------------------
    - chmod -R 777 web/sites/default/files
    - vendor/bin/drush runserver 127.0.0.1:8888 >/tmp/runserver.log 2>&1 &
    - for i in $(seq 1 30); do curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && break; sleep 1; done
    - curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && echo "site is up"
  script:
    - cd "$CI_PROJECT_DIR"
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js --json tests/reports/cucumber_report.json --out tests/reports/cucumber_report.html || true
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
  allow_failure: false
