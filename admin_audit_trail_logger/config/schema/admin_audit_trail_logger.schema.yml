admin_audit_trail_logger.settings:
  type: config_object
  label: 'Admin Audit Trail Logger settings'
  mapping:
    mode:
      type: string
      label: 'Logging mode'
      constraints:
        Choice:
          - hybrid
          - psr3_only
    channel:
      type: string
      label: 'PSR-3 logger channel'
    severity_map:
      type: sequence
      label: 'Severity map, keyed by operation (with a "default" fallback)'
      sequence:
        type: string
        label: 'PSR-3 severity level'
